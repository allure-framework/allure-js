compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

packageExtensions:
  codeceptjs@*:
    dependencies:
      debug: "*"
  newman@*:
    peerDependencies:
      newman-reporter-allure: "workspace:*"
  "@vitest/mocker@*":
    dependencies:
      vite: "*"

plugins:
  - ./plugin-ci-version.cjs

supportedArchitectures:
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
  os:
    - darwin
    - linux
    - win32

yarnPath: .yarn/releases/yarn-4.18.1.cjs
