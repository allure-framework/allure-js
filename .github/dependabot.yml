version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "pr:dependencies"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    groups:
      vite-stack:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "@voidzero-dev/vite-plus*"
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "pr:dependencies"
    open-pull-requests-limit: 5
